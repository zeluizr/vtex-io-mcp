name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub Release
      id-token: write   # required for provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      # Publish to npmjs.com
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Re-apply deprecation — this is an archived, study-only package.
      # The automation token (NPM_TOKEN) bypasses 2FA/OTP.
      - name: Re-apply deprecation
        run: |
          npm deprecate "vtex-io-mcp@*" "Descontinuado y solo para estudio. Usa el MCP oficial de VTEX: https://www.vtex.com/en-us/vtex-vision/developer-mcp"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
