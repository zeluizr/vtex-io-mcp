name: Publish to npm and GitHub Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub Release
      id-token: write   # required for provenance + OIDC
      packages: write   # required for GitHub Packages

    steps:
      - uses: actions/checkout@v4

      # Setup node WITHOUT registry-url so setup-node doesn't inject
      # an empty _authToken that would block OIDC Trusted Publisher auth
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run build

      # Publish to npmjs.com via OIDC Trusted Publisher (no token needed)
      - run: npm publish --provenance --access public

      # Publish to GitHub Packages (requires scoped name + GITHUB_TOKEN)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'

      - run: npm pkg set name="@zeluizr/vtex-io-mcp"

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
